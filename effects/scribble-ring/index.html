<!doctype html>
<!--
  Scribble Ring. Open this file directly; it needs no server and no network.
  Files: effect.js (the effect), effect.css (its styles).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribble Ring</title>
<link rel="stylesheet" href="effect.css">
<style>
  html, body { margin: 0; background: #fff; }
  #stage { max-width: 1056px; height: clamp(460px, 64vh, 620px); margin: 40px auto; }
  @media (max-width: 1120px) { #stage { margin: 40px 32px; } }
  @media (max-width: 760px) { #stage { margin: 28px 16px; height: min(540px, 72vh); border-radius: 24px; } }
</style>
</head>
<body>
<div id="stage" aria-label="Scribble Ring"></div>
<script src="effect.js"></script>
<script>
  const effect = mountScribbleRing(document.getElementById('stage'));
</script>
</body>
</html>
